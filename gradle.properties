org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Android Studio syncs the modules in parallel (and doesn't ask to turn this on).
org.gradle.tooling.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The GitHub repository (owner/name) whose releases Lumbina updates itself from.
lumbina.updatesRepo=Kasavy/lumbina
