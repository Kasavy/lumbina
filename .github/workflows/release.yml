name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Lumbina offers an update by the version's name and the device installs by its code: a tag
      # other than the name would be offered over and over, a code not above the last one refused.
      - name: Check the version against the tag
        run: |
          version() { sed -n "s/^ *$1 = \"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" "$2"; }
          name=$(version versionName app/build.gradle.kts)
          code=$(version versionCode app/build.gradle.kts)
          test "v$name" = "$GITHUB_REF_NAME" || { echo "versionName $name is not the tag $GITHUB_REF_NAME"; exit 1; }
          git fetch --depth=1 origin 'refs/tags/*:refs/tags/*'
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -A1 -x "$GITHUB_REF_NAME" | sed -n 2p)
          if [ -n "$previous" ]; then
            git show "$previous:app/build.gradle.kts" > previous.gradle.kts
            last=$(version versionCode previous.gradle.kts)
            test "$code" -gt "$last" || { echo "versionCode $code is not above $last of $previous"; exit 1; }
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMBINA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "LUMBINA_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      # Without the prefix the build still succeeds, with plain process names: not what a release is.
      - name: Check the process prefix
        env:
          LUMBINA_PROCESS_PREFIX: ${{ secrets.LUMBINA_PROCESS_PREFIX }}
        run: test -n "$LUMBINA_PROCESS_PREFIX" || { echo "LUMBINA_PROCESS_PREFIX secret is missing"; exit 1; }

      - name: Test and build
        env:
          LUMBINA_KEYSTORE_FILE: release.keystore
          LUMBINA_KEYSTORE_PASSWORD: ${{ secrets.LUMBINA_KEYSTORE_PASSWORD }}
          LUMBINA_KEY_ALIAS: ${{ secrets.LUMBINA_KEY_ALIAS }}
          LUMBINA_KEY_PASSWORD: ${{ secrets.LUMBINA_KEY_PASSWORD }}
          LUMBINA_PROCESS_PREFIX: ${{ secrets.LUMBINA_PROCESS_PREFIX }}
        run: ./gradlew checkModuleGraph test testDebugUnitTest testFossDebugUnitTest :app:assembleFossRelease

      - name: Collect artifacts
        run: |
          mkdir dist
          cp app/build/outputs/apk/foss/release/*.apk "dist/lumbina-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Until v1.0 every tag is published as a pre-release; one is made the release by hand on GitHub.
          prerelease: true
