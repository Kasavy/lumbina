name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Static checks
        run: ./gradlew checkModuleGraph spotlessCheck detekt lintFossDebug --continue

      - name: Unit and Robolectric tests
        run: ./gradlew test testDebugUnitTest testFossDebugUnitTest --continue

      - name: Release build (R8)
        run: ./gradlew :app:assembleFossRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: lumbina-foss-release-unsigned-or-debug-signed
          path: app/build/outputs/apk/foss/release/*.apk
